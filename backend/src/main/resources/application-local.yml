# Keeps the project runnable before PostgreSQL has been provisioned.
# Uses in-memory H2 database to allow JPA repositories to function.
spring:
  datasource:
    url: jdbc:h2:mem:nodara-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

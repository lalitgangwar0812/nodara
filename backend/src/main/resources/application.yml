server:
  port: ${SERVER_PORT:8080}

nodara:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  heartbeat:
    timeout-seconds: ${HEARTBEAT_TIMEOUT_SECONDS:90}

spring:
  application:
    name: nodara-backend
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:nodara-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.nodara.platform: INFO
